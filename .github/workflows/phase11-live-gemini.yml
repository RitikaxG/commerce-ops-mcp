name: Phase 11 live Gemini evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/commerce_ops
  DEMO_DATABASE_URL: postgresql://commerce_demo:demo_password@127.0.0.1:5432/commerce_ops
  WORKFLOW_DATABASE_URL: postgresql://commerce_workflow:workflow_password@127.0.0.1:5432/commerce_ops
  MCP_ALLOWED_HOSTS: 127.0.0.1
  MODEL_PROVIDER: gemini
  MODEL_NAME: gemini-3.6-flash
  MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}

jobs:
  live-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commerce_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commerce_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Check live-evaluation secret
        id: secret
        shell: bash
        run: |
          if [ -z "$MODEL_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "MODEL_API_KEY is not configured; live Gemini evaluation skipped."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install frozen dependencies
        if: steps.secret.outputs.enabled == 'true'
        run: bun install --frozen-lockfile

      - name: Prepare approved database
        if: steps.secret.outputs.enabled == 'true'
        run: |
          bun run db:generate
          bun run db:migrate
          bun run db:setup-access
          bun run db:reset-demo
          bun run db:verify-demo
          bun run db:verify-access

      - name: Verify configured Gemini model
        if: steps.secret.outputs.enabled == 'true'
        run: bun run agent:model-smoke

      - name: Run real Gemini MCP evaluation
        if: steps.secret.outputs.enabled == 'true'
        run: bun run eval:agent:gemini

      - name: Restore clean workflow-demo state
        if: always() && steps.secret.outputs.enabled == 'true'
        run: |
          bun run db:reset-workflow-demo
          bun run db:verify-demo
