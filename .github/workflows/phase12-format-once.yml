name: Phase 12 format once

on:
  push:
    branches: [phase/12-aws-hosted-mcp]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/12-aws-hosted-mcp

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Apply repository formatting
        run: |
          bunx prettier --write \
            "apps/api/app.ts" \
            "apps/api/tests/health.test.ts" \
            "packages/evaluations/hosted-ai.ts" \
            "packages/evaluations/hosted-mcp.ts" \
            "packages/evaluations/runtime.ts" \
            "packages/evaluations/direct/run.ts" \
            "README.md" \
            "docs/deployment/aws-ec2.md" \
            "docs/evaluations/phase-12-hosted-mcp.md"

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/app.ts \
            apps/api/tests/health.test.ts \
            packages/evaluations/hosted-ai.ts \
            packages/evaluations/hosted-mcp.ts \
            packages/evaluations/runtime.ts \
            packages/evaluations/direct/run.ts \
            README.md \
            docs/deployment/aws-ec2.md \
            docs/evaluations/phase-12-hosted-mcp.md
          git commit -m "style(phase12): format hosted deployment changes"
          git push origin HEAD:phase/12-aws-hosted-mcp
