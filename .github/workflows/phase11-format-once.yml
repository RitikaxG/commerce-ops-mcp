name: Phase 11 one-time formatting

on:
  push:
    branches: [phase/11-gemini-ai-host]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase11-one-time-format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/11-gemini-ai-host
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Format Phase 11 files
        run: |
          bunx prettier --write \
            "packages/agent/**/*.ts" \
            "packages/schemas/agent.ts" \
            "packages/schemas/index.ts" \
            "packages/evaluations/agent-gemini.ts" \
            "docs/evaluations/phase-11-gemini-ai-host.md" \
            "docs/deployment/post-phase-11-staging-handoff.md" \
            "docs/architecture/package-graph.md" \
            "README.md" \
            "AGENTS.md"

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/agent \
            packages/schemas/agent.ts \
            packages/schemas/index.ts \
            packages/evaluations/agent-gemini.ts \
            docs/evaluations/phase-11-gemini-ai-host.md \
            docs/deployment/post-phase-11-staging-handoff.md \
            docs/architecture/package-graph.md \
            README.md \
            AGENTS.md
          git commit -m "style(agent): format Phase 11 implementation"
          git pull --rebase origin phase/11-gemini-ai-host
          git push origin HEAD:phase/11-gemini-ai-host
