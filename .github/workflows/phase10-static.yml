name: Phase 10 static checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase10-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: bun run --filter @repo/mcp typecheck
      - run: bun run --filter @repo/mcp test
      - run: bun run --filter @repo/api typecheck
      - run: bun run --filter @repo/api test
      - run: bun run --filter @repo/evaluations typecheck
      - run: bun run --filter @repo/evaluations test
