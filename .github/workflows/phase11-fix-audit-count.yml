name: Phase 11 one-time evaluator correction

on:
  push:
    branches: [phase/11-gemini-ai-host]

permissions:
  contents: write

jobs:
  fix-audit-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/11-gemini-ai-host

      - name: Correct the deterministic nine-scenario audit count
        run: |
          if ! grep -q 'auditEvents: 54' packages/evaluations/agent-gemini.ts; then
            exit 0
          fi
          sed -i 's/auditEvents: 54/auditEvents: 106/' packages/evaluations/agent-gemini.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/evaluations/agent-gemini.ts
          git commit -m "fix(evaluations): assert deterministic audit count"
          git push origin HEAD:phase/11-gemini-ai-host
