name: commerce-ops-mcp

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ${ADMIN_ENV_FILE:-.env.admin}
    expose:
      - "5432"
    volumes:
      - commerce_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  api:
    image: commerce-ops-mcp-api:${IMAGE_TAG:-phase12}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-.env.runtime}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:3000/health'); if (!response.ok) process.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  admin:
    image: commerce-ops-mcp-api:${IMAGE_TAG:-phase12}
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["admin"]
    env_file:
      - ${ADMIN_ENV_FILE:-.env.admin}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "--version"]
    networks:
      - backend

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-commerce-mcp.ritikaxg.co.in}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
      - backend

volumes:
  commerce_postgres_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
